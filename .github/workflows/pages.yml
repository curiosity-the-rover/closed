name: Update GitHub Pages

# Сайт публикуется из ветки gh-pages; при каждом обновлении main она синхронизируется с main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
